
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>CatatanKu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div>
      <h1>CatatanKu</h1>
      <p>Semua ide, tersimpan di sini.</p>
    </div>

    <button id="themeBtn" class="theme-btn">
      ☀
    </button>
  </header>

  <!-- HALAMAN UTAMA -->
  <main class="container">

    <div class="search-box">
      <span>⌕</span>
      <input
        type="search"
        id="searchInput"
        placeholder="Cari catatan..."
      >
    </div>

    <section class="notes-header">
      <h2>Catatan saya</h2>
      <span id="noteCount">0 catatan</span>
    </section>

    <section id="notesContainer" class="notes-grid">
    </section>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon">✎</div>
      <h3>Belum ada catatan</h3>
      <p>Mulai tulis ide atau sesuatu yang penting.</p>
    </div>

  </main>

  <!-- TOMBOL TAMBAH -->
  <button id="addBtn" class="add-btn">+</button>

  <!-- HALAMAN EDITOR -->
<section id="editorOverlay" class="editor-page" hidden>
    <header class="editor-topbar">

      <button id="closeEditor" class="back-btn">
        ←
      </button>

      <h2 id="editorTitle">Catatan baru</h2>

      <button id="saveBtn" class="top-save-btn">
        Simpan
      </button>

    </header>

    <main class="editor-content">

      <input
        type="text"
        id="noteTitle"
        placeholder="Judul catatan"
        maxlength="80"
      >

      <textarea
        id="noteContent"
        placeholder="Mulai menulis sesuatu..."
      ></textarea>

      <div class="editor-bottom">

        <button id="deleteBtn" class="delete-btn">
          Hapus catatan
        </button>

      </div>

    </main>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>CatatanKu © 2026</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
